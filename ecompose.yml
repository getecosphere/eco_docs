# ecompose v2 — eco_docs
# The public Ecosphere documentation site (docs.getecosphere.com): a VitePress
# static frontend composed from source (this repo). email-manager composed from
# the LXS registry. contact-form is deferred (repo does not exist yet).
#
# Builds happen on the developer machine; the server is executable-only.

project: eco_docs
main: eco_docs

ct:
  id: 201

data:
  mongo: 203

estates:
  eco_docs:
    hostname: docs.getecosphere.com
    ingress: tunnel
    cloudflare_account: getecosphere
    services:
      - gateway
      - eco-docs-frontend
      - email-manager-backend

expose:
  enabled: true
  hostname: docs.getecosphere.com
  service: gateway
  proxy_ct: 200
  cloudflare_account: getecosphere

services:
  gateway:
    lxs: gateway@0.3.0
    port: 4597

  eco-docs-frontend:
    path: frontend
    runtimes: [node@20]
    access:
      routes:
        - path: /*
          level: public

  email-manager-backend:
    lxs: email-manager@1.0.1
    grants: { secrets: [MONGODB_URI, BREVO_API_KEY, MAIL_FROM_EMAIL, MAIL_FROM_NAME] }
