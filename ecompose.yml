# ecompose v2 — eco_docs
# The public eco documentation site (eco.stuff8.com): a VitePress static
# frontend composed from source (this repo). email-manager composed from the
# LXS registry. contact-form is deferred (repo does not exist yet).
#
# Builds happen on the developer machine; the server is executable-only.

project: eco_docs
main: eco_docs

estates:
  eco_docs:
    hostname: eco.stuff8.com
    ingress: tunnel
    cloudflare_account: stuff8
    services:
      - eco-docs-frontend
      - email-manager-backend

services:
  eco-docs-frontend:
    path: frontend
    runtimes: [node@20]

  email-manager-backend:
    lxs: email-manager@1.0.1
    grants: { secrets: [MONGODB_URI, BREVO_API_KEY, MAIL_FROM_EMAIL, MAIL_FROM_NAME] }
